{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="signup-page">

<div class="auth-container">
    <div class="auth-card">
        <h2>Set New Password</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Update Password</button>
        </form>
    </div>
</div>

</body>
</html>
