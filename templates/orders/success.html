{% extends 'base.html' %}

{% block content %}

<div class="success-card">
    <div class="success-icon">✅</div>

    <h1>Order Placed Successfully</h1>
    <p>Your order has been saved and is now pending processing.</p>

    <div class="success-info">
        <div>
            <span>Order ID</span>
            <strong>#{{ order.id }}</strong>
        </div>

        <div>
            <span>Total Amount</span>
            <strong>₹{{ order.total_price }}</strong>
        </div>

        <div>
            <span>Status</span>
            <strong>{{ order.get_status_display }}</strong>
        </div>
    </div>

    <div class="success-actions">
        <a href="{% url 'my_orders' %}" class="btn">View My Orders</a>
        <a href="{% url 'product_list' %}" class="secondary-btn">Order More</a>
    </div>
</div>

{% endblock %}
